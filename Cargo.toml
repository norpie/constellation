[workspace]
resolver = "2"

members = [
    # Libraries
    "libs/*",

    # Running services
    # "runtime/*",

    # Example services
    "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["norpie"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Error handling
thiserror = "2"

# Async utilities
async-trait = "0.1"

# Schema/defaults
schemars = "1"
smart-default = "0.7"

# Misc
rand = "0.9"
